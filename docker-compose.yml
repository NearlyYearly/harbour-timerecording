services:
  # Unit tests for the Python logic (Python 3.8 like SailfishOS 5).
  test:
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    volumes:
      - .:/src
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests"]

  # Desktop preview on the host Wayland session. Data lives in preview/home.
  preview:
    build:
      context: .
      dockerfile: docker/preview.Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/src:ro
      - ./preview/home:/home/preview
      - /etc/localtime:/etc/localtime:ro
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY:-wayland-1}:/tmp/runtime/wayland-0
    tmpfs:
      - /tmp/runtime:mode=0700,uid=${UID:-1000},gid=${GID:-1000}
    environment:
      HOME: /home/preview
      XDG_RUNTIME_DIR: /tmp/runtime
      WAYLAND_DISPLAY: wayland-0
      QT_QPA_PLATFORM: wayland
      QT_WAYLAND_DISABLE_WINDOWDECORATION: "1"
      # Qt 5.6 on the device needs the old Connections syntax; silence 5.15 warnings.
      QT_LOGGING_RULES: "qt.qml.connections=false"
      PYTHONDONTWRITEBYTECODE: "1"

  # Headless smoke run: screenshots of every page into preview/shots, QML warnings on stdout.
  smoke:
    build:
      context: .
      dockerfile: docker/preview.Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/src:ro
      - ./preview/shots:/shots
      - /etc/localtime:/etc/localtime:ro
    environment:
      QT_LOGGING_RULES: "qt.qml.connections=false"
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["/src/preview/smoke.sh"]

  # QML tests for the preview stand-ins (e.g. the pulley gesture).
  qmltest:
    build:
      context: .
      dockerfile: docker/preview.Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/src:ro
    environment:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_LOGGING_RULES: "qt.qml.connections=false"
    entrypoint: ["/usr/lib/qt5/bin/qmltestrunner", "-import", "/src/preview/shim", "-input", "/src/preview/tests"]

  # Render the launcher icons from icons/harbour-timerecord.svg.
  icons:
    build:
      context: .
      dockerfile: docker/preview.Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/src
    entrypoint: ["sh", "-c", "for s in 86 108 128 172; do mkdir -p /src/icons/$${s}x$${s} && rsvg-convert -w $$s -h $$s /src/icons/harbour-timerecord.svg -o /src/icons/$${s}x$${s}/harbour-timerecord.png; done; ls -R /src/icons"]

  # Build the noarch RPM with the Sailfish SDK (target SailfishOS-5.0.0.43-aarch64).
  build:
    image: coderus/sailfishos-platform-sdk-aarch64@sha256:74dd896143657a0b02137a7c2b5b378960d66e0b84c68f2f7e4e97b718e2255d
    user: root
    volumes:
      - .:/src
    environment:
      HOST_UID: "${UID:-1000}"
      HOST_GID: "${GID:-1000}"
    entrypoint: ["/src/docker/sdk.sh"]
